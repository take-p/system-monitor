name: MenubarMonitor
options:
  bundleIdPrefix: local.system-monitor
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  MenubarMonitor:
    type: application
    platform: macOS
    sources:
      - Sources/MenubarMonitor
    info:
      path: Sources/MenubarMonitor/Info.plist
      properties:
        CFBundleDisplayName: MenubarMonitor
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        # メニューバー専用のアプリにする(Dockにアイコンを出さない)
        LSUIElement: true
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.system-monitor.MenubarMonitor
        # App Storeでの配信は保留。今の機能(全プロセスの走査など)を移植するためサンドボックスは使わない
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
